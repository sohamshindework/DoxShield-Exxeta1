# Local-development PostgreSQL for the incident store. The credentials below are
# non-secret local defaults. Point the app at it with:
#   export DATABASE_URL=postgresql+psycopg://doxshield:doxshield@localhost:5432/doxshield
# then install the driver (LGPL) and run migrations:
#   pip install "psycopg[binary]>=3.1" && alembic upgrade head
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: doxshield
      POSTGRES_PASSWORD: doxshield
      POSTGRES_DB: doxshield
    ports:
      - "5432:5432"
    volumes:
      - doxshield_pgdata:/var/lib/postgresql/data

volumes:
  doxshield_pgdata:
