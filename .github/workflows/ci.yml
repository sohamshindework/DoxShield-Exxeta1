name: ci

# Lint, type-check and test on Linux using the synthetic fixture backend.
# No macOS scanners run here; DOXSHIELD_BACKEND=fixture guarantees synthetic data.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOXSHIELD_BACKEND: fixture
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sidecar/requirements.txt
          pip install pytest ruff mypy

      - name: Lint (ruff)
        run: ruff check sidecar/scanner/backend.py sidecar/scanner/ip_geo.py sidecar/incidents sidecar/mcp_server sidecar/agent sidecar/ai/llm_gateway.py sidecar/request_guard.py tests

      - name: Type-check (mypy, lenient)
        run: mypy sidecar/scanner/backend.py sidecar/scanner/ip_geo.py sidecar/incidents sidecar/mcp_server sidecar/agent sidecar/ai/llm_gateway.py sidecar/request_guard.py
        continue-on-error: true

      - name: Tests (fixture backend; LLM off/replayed, no network or API keys)
        run: pytest -q

      - name: Migrations apply cleanly and match the ORM
        run: |
          DATABASE_URL=sqlite:///ci-migrations.db alembic upgrade head
          DATABASE_URL=sqlite:///ci-migrations.db alembic check
