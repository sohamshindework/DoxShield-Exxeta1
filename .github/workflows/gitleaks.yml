name: security-secret-scan

# Hard gate: fail the build if any secret is found in the working tree or in
# the full commit history. Pinned to the gitleaks version used in the local audit.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history
        run: gitleaks git . --log-opts="--all --full-history" --redact --no-banner --verbose

      - name: Scan working tree
        run: gitleaks dir . --redact --no-banner --verbose
