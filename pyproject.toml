[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["sidecar/incidents/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: line length handled by formatter; UP042: keep explicit (str, Enum) bases.
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
